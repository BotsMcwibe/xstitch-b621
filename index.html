<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Chart viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"></head><body>
<header><b>Cross-stitch chart</b><nav><a class="on" href="index.html">Viewer</a><a href="review.html">Review</a><a href="compare.html">Compare</a><a href="symbols.html">Symbols</a></nav>
<span>Show: <button class="btn sel" data-mode="sym">Symbols</button><button class="btn" data-mode="col">Colours + symbols</button></span>
<label><input type="checkbox" id="lowChk"> Outline low-confidence cells</label>
<label>Go to row <input id="gr" size="3"> col <input id="gc" size="3"></label><button class="btn" id="goBtn">Go</button>
</header><div id="statusbar"><span id="status"></span></div>
<main><div id="side"><div id="info"></div><p>Click a colour to highlight it (others fade). Click again to clear.</p><div id="legend"></div></div>
<div id="stage"><canvas id="cv"></canvas><div id="tip"></div></div></main>
<script type="module">
import {start,keyMap,loadImages,getCorr} from './js/bundle.js';
import {loadSymbols,symbolBitmap,symUrl} from './js/symbols.js';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage'),tip=document.getElementById('tip');
let grey={},B=null,K={},G={},grid=null,mode='sym',hi=null,showLow=false,lowSet=new Set(),view={s:14,x:40,y:40};
function resize(){cv.width=stage.clientWidth;cv.height=stage.clientHeight;draw();}addEventListener('resize',resize);
function lum(h){const n=parseInt(h.slice(1),16);return 0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255);}
function draw(){ctx.fillStyle='#fafafa';ctx.fillRect(0,0,cv.width,cv.height);if(!B)return;
  const {rows,cols}=B.grid,s=view.s;const c0=Math.max(0,Math.floor(-view.x/s)),c1=Math.min(cols,Math.ceil((cv.width-view.x)/s)),r0=Math.max(0,Math.floor(-view.y/s)),r1=Math.min(rows,Math.ceil((cv.height-view.y)/s));
  for(let r=r0;r<r1;r++)for(let c=c0;c<c1;c++){const nr=grid[r*cols+c],k=K[nr],x=view.x+c*s,y=view.y+r*s;
    const fade=hi!==null&&nr!==hi;ctx.globalAlpha=fade?0.15:1;
    if(mode==='col'){ctx.fillStyle=k?k.hex:'#fff';ctx.fillRect(x,y,s,s);}else{ctx.fillStyle=s>=6?'#fff':(grey[nr]||'#fff');ctx.fillRect(x,y,s,s);}
    if(s>=6){const sz=s*0.86,g=symbolBitmap(nr,sz,mode==='col'&&k&&lum(k.hex)<110?'#fff':'#000');ctx.drawImage(g,x+(s-sz)/2,y+(s-sz)/2,sz,sz);}
  }
  ctx.globalAlpha=1;
  ctx.strokeStyle='#555';for(let c=c0;c<=c1;c++){const bold=c%10===0;if(!bold&&s<6)continue;ctx.lineWidth=bold?2:0.5;ctx.beginPath();ctx.moveTo(view.x+c*s,view.y+r0*s);ctx.lineTo(view.x+c*s,view.y+r1*s);ctx.stroke();}
  for(let r=r0;r<=r1;r++){const bold=r%10===0;if(!bold&&s<6)continue;ctx.lineWidth=bold?2:0.5;ctx.beginPath();ctx.moveTo(view.x+c0*s,view.y+r*s);ctx.lineTo(view.x+c1*s,view.y+r*s);ctx.stroke();}
  if(hi!==null){ctx.strokeStyle='#0072B2';ctx.lineWidth=2;for(let r=r0;r<r1;r++)for(let c=c0;c<c1;c++)if(grid[r*cols+c]===hi)ctx.strokeRect(view.x+c*s+1,view.y+r*s+1,s-2,s-2);}
  if(showLow){ctx.strokeStyle='#E69F00';ctx.lineWidth=Math.max(2,s/6);for(const v of lowSet){const r=Math.floor(v/cols),c=v%cols;if(r>=r0&&r<r1&&c>=c0&&c<c1)ctx.strokeRect(view.x+c*s+1,view.y+r*s+1,s-2,s-2);}}
  ctx.fillStyle='#000';ctx.font='12px system-ui';ctx.fillRect(0,0,0,0);
  ctx.fillStyle='rgba(250,250,250,0.9)';ctx.fillRect(0,0,cv.width,16);ctx.fillRect(0,0,30,cv.height);ctx.fillStyle='#000';
  for(let c=Math.ceil(c0/10)*10;c<=c1;c+=10)if(c>0)ctx.fillText(c,view.x+c*s-8,12);
  for(let r=Math.ceil(r0/10)*10;r<=r1;r+=10)if(r>0)ctx.fillText(r,2,view.y+r*s+4);
}
function counts(){const n={};grid.forEach(v=>n[v]=(n[v]||0)+1);return n;}
function legend(){const n=counts();const el=document.getElementById('legend');el.innerHTML='';
  B.key.forEach(k=>{const d=document.createElement('div');d.className='legend-row'+(hi===k.nr?' on':'');const got=n[k.nr]||0,diff=got-k.count;
    d.innerHTML=`<span class="mono">${k.nr}</span><span class="sw" style="background:${k.hex}"></span><img src="${symUrl(k.nr)}"><span>${k.symbol}${k.code?' · '+k.code:''}<br><small>key ${k.count} · chart ${got}${diff?` <span class="mismatch">(${diff>0?'+':''}${diff})</span>`:' ✓'}</small></span>`;
    d.onclick=()=>{hi=hi===k.nr?null:k.nr;legend();draw();};el.appendChild(d);});}
async function onLoad(b){B=b;K=keyMap(b);G=await loadImages(b.glyphs);await loadSymbols();grey={};for(const k of b.key){const g=symbolBitmap(k.nr,24),x=document.createElement('canvas').getContext('2d');x.canvas.width=x.canvas.height=1;x.fillStyle='#fff';x.fillRect(0,0,1,1);x.drawImage(g,0,0,1,1);const v=x.getImageData(0,0,1,1).data[0];grey[k.nr]=`rgb(${v},${v},${v})`;}
  grid=Int16Array.from(b.grid.nr);const corr=getCorr();let nc=0;for(const [rc,v] of Object.entries(corr)){const [r,c]=rc.split(',').map(Number);grid[(r-1)*b.grid.cols+(c-1)]=v;nc++;}
  lowSet=new Set((b.grid.low||[]).filter(([r,c])=>!corr[r+','+c]).map(([r,c])=>(r-1)*b.grid.cols+(c-1)));
  document.getElementById('info').innerHTML=`<b>${b.meta?.title||''}</b><br>${b.grid.cols}×${b.grid.rows} stitches · ${b.key.length} colours<br>${b.grid.low?.length||0} low-confidence cells, ${nc} corrected in Review`;
  view.s=Math.max(4,Math.min(20,Math.floor((stage.clientWidth-50)/b.grid.cols)));view.x=40;view.y=24;hi=null;legend();resize();}
document.querySelectorAll('[data-mode]').forEach(bt=>bt.onclick=()=>{mode=bt.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('sel',x===bt));draw();});
document.getElementById('lowChk').onchange=e=>{showLow=e.target.checked;draw();};
document.getElementById('goBtn').onclick=()=>{const r=+gr.value,c=+gc.value;if(!B||!r||!c)return;view.s=Math.max(view.s,24);view.x=cv.width/2-(c-0.5)*view.s;view.y=cv.height/2-(r-0.5)*view.s;draw();
  const s=view.s;ctx.strokeStyle='#0072B2';ctx.lineWidth=4;ctx.strokeRect(view.x+(c-1)*s-3,view.y+(r-1)*s-3,s+6,s+6);};
cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.15:1/1.15,ns=Math.min(80,Math.max(1.5,view.s*f));const mx=e.offsetX,my=e.offsetY;view.x=mx-(mx-view.x)*ns/view.s;view.y=my-(my-view.y)*ns/view.s;view.s=ns;draw();},{passive:false});
let drag=null;cv.onmousedown=e=>drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};addEventListener('mouseup',()=>drag=null);
cv.onmousemove=e=>{if(drag){view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;draw();tip.style.display='none';return;}
  if(!B)return;const c=Math.floor((e.offsetX-view.x)/view.s),r=Math.floor((e.offsetY-view.y)/view.s);
  if(r<0||c<0||r>=B.grid.rows||c>=B.grid.cols){tip.style.display='none';return;}
  const nr=grid[r*B.grid.cols+c],k=K[nr],cf=B.grid.conf?B.grid.conf[r*B.grid.cols+c]:null;
  tip.innerHTML=`Row ${r+1}, col ${c+1}<br>#${nr} ${k?k.symbol:''}${k&&k.code?' · '+k.code:''}${cf!=null?`<br>confidence ${cf}%`:''}`;tip.style.left=(e.offsetX+14)+'px';tip.style.top=(e.offsetY+14)+'px';tip.style.display='block';};
cv.onmouseleave=()=>tip.style.display='none';
start(onLoad);resize();
</script></body></html>
